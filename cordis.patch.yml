# Replace both shipped loopback trust surfaces from one Bundle. The WebServer
# entry owns the Host request view; the package root remains the dual-face
# Connection plugin whose browser half fixes page-local loopback classification.
- id: webserver
  disabled: true

- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  disabled: true

- insert:
    - id: loopback-spoof-webserver
      name: dsh-loopback-spoof/webserver
      inject: [webStartup]
      config:
        host: !!js ctx.webStartup.host ?? '0.0.0.0'
        port: !!js ctx.webStartup.port ?? 3080

    - id: loopback-spoof-connection
      name: dsh-loopback-spoof
      inject: [webRuntime]
      config:
        trustedHosts: !!js ctx.webRuntime.trustedHosts
