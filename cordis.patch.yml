# Keep the official WebServer and its authentication-visible request facts,
# but bind all interfaces by default so Web runtime derives LAN trust and an
# authenticated LAN URL. Replace only the dual-face Connection entry: its Host
# half re-exports the official implementation, while its browser half fixes
# page-local loopback classification.
- id: webserver
  config:
    host: !!js ctx.webStartup.host ?? '0.0.0.0'
    port: !!js ctx.webStartup.port ?? 3080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  disabled: true

- insert:
    - id: loopback-spoof-connection
      name: dsh-loopback-spoof
      inject: [webRuntime]
      config:
        trustedHosts: !!js "['dsh.hale-halibut.ts.net', ...ctx.webRuntime.trustedHosts]"
